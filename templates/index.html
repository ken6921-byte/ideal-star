<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理想之星</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght:900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans TC', sans-serif; margin: 0; padding: 0; }
        body { 
            background: url('/static/background.webp') center/cover no-repeat fixed;
            min-height: 100vh; 
            overflow-x: hidden;
        }
        .main-title { 
            color: #fff; 
            text-shadow: 6px 6px 20px rgba(0,0,0,0.8); 
            font-size: 7rem; 
            font-weight: 900; 
            margin: 60px 0; 
            letter-spacing: 20px;
            text-align: center;
        }
        .slider-container {
            overflow: hidden;
            padding: 40px 0;
        }
        .slider-track {
            display: flex;
            gap: 50px;
            animation: scroll 60s linear infinite;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-420px * 40)); }
        }
        .star-card {
            background: #fff;
            border: 18px solid #fff;
            border-radius: 15px;
            width: 380px;
            flex-shrink: 0;
            box-shadow: 0 30px 70px rgba(0,0,0,0.6);
            transition: all 0.5s;
            transform: perspective(1000px) rotateY(-5deg);
        }
        .star-card:nth-child(even) {
            transform: perspective(1000px) rotateY(5deg);
        }
        .star-card:hover {
            transform: perspective(1000px) translateY(-25px) scale(1.12);
        }
        .star-img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            border-radius: 8px;
        }
        .star-info {
            padding: 25px;
            text-align: center;
        }
        .star-award {
            font-size: 1.6rem;
            font-weight: 900;
            color: #d32f2f;
        }
        .star-name {
            font-size: 2rem;
            font-weight: 900;
            color: #1a1a1a;
        }
        .admin-btn { 
            position: fixed; 
            bottom: 40px; 
            right: 40px; 
            background: #d32f2f;
            border: none;
            font-size: 1.3rem;
            padding: 18px 35px;
            border-radius: 60px;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        @media (max-width: 768px) {
            .main-title { font-size: 4rem; letter-spacing: 10px; }
        }
    </style>
</head>
<body>
    <h1 class="main-title">理想之星</h1>
    <div class="slider-container">
        <div class="slider-track">
            {% for star in stars + stars %}
            <div class="star-card">
                <picture>
                    <source media="(max-width: 768px)" srcset="/static/{{ '%02d' % ((loop.index0 % 20) + 1) }}_mobile.webp">
                    <img loading="lazy" src="/static/{{ '%02d' % ((loop.index0 % 20) + 1) }}.webp" class="star-img" alt="{{ star[1] }}">
                </picture>
                <div class="star-info">
                    <div class="star-award">🏆 {{ star[3] }}</div>
                    <div class="star-name">{{ star[1] }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <a href="/admin" class="admin-btn">⚙️ 管理</a>
</body>
</html>
