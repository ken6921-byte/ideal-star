<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理想之星 - 理想保險年度表揚</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans TC', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .main-title { 
            color: #fff; 
            text-shadow: 5px 5px 15px rgba(0,0,0,0.5); 
            font-size: 6rem; 
            font-weight: 900; 
            margin: 60px 0 20px 0; 
            letter-spacing: 12px;
        }
        .subtitle {
            color: rgba(255,255,255,0.95);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 40px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.4);
            letter-spacing: 2px;
        }
        
        /* 橫向滑動容器 */
        .slider-container {
            overflow: hidden;
            width: 100%;
            margin: 50px 0;
            padding: 30px 0;
        }
        .slider-track {
            display: flex;
            gap: 30px;
            animation: scroll 40s linear infinite;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-350px * 10 - 300px)); }
        }
        .slider-track:hover { animation-play-state: paused; }
        
        /* 績優卡片 */
        .star-card {
            background: rgba(255,255,255,0.98);
            border-radius: 25px;
            width: 350px;
            flex-shrink: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            transition: all 0.4s ease;
            overflow: hidden;
        }
        .star-card:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        .star-img {
            width: 100%;
            height: 450px;
            object-fit: cover;
        }
        .star-info {
            padding: 25px;
            text-align: center;
            background: linear-gradient(180deg, #fff 0%, #f8f9fa 100%);
        }
        .star-award {
            font-size: 1.5rem;
            font-weight: 900;
            color: #FF6B35;
            margin-bottom: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .star-name {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .star-position {
            font-size: 1.1rem;
            color: #666;
        }
        
        /* 業績跑馬燈 */
        .marquee-box { 
            background: linear-gradient(90deg, #000 0%, #1a1a1a 50%, #000 100%);
            border: 5px solid #FFD700; 
            color: #FFD700; 
            font-size: 2rem; 
            font-weight: 900; 
            padding: 20px 0; 
            border-radius: 60px; 
            margin: 40px auto; 
            max-width: 95%;
            box-shadow: 0 10px 40px rgba(255,215,0,0.3);
        }
        
        .bottom-slogan {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            margin-top: 60px;
            letter-spacing: 3px;
        }
        
        .admin-btn { 
            position: fixed; 
            bottom: 40px; 
            right: 40px; 
            z-index: 1000;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            border: none;
            font-size: 1.2rem;
            padding: 15px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border-radius: 50px;
            font-weight: bold;
        }
        .admin-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
<div class="container-fluid py-5">
    <h1 class="text-center main-title">理想之星</h1>
    <p class="text-center subtitle">突破每一道界線 • 投出無限可能</p>
    
    <div class="marquee-box">
        <marquee scrollamount="12">
            {% for p in performance %}
            🏆 {{ p[1] }} {{ p[2] }} 完成進度: {{ p[4] }}% 
            {% if not loop.last %} | {% endif %}
            {% endfor %}
        </marquee>
    </div>

    <div class="slider-container">
        <div class="slider-track">
            {% for star in (stars + stars) %}
            <div class="star-card">
                <img src="{{ star[4] or 'https://via.placeholder.com/350x450/667eea/FFFFFF?text=' + star[1] }}" 
                     class="star-img" alt="{{ star[1] }}">
                <div class="star-info">
                    <div class="star-award">{{ star[3] }}</div>
                    <div class="star-name">{{ star[1] }}</div>
                    <div class="star-position">{{ star[2] }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="text-center bottom-slogan">
        🔥 理想精神 • 無限可能 🔥
    </div>
</div>

<a href="/admin" class="btn btn-lg shadow admin-btn">⚙️ 管理後台</a>
</body>
</html>
