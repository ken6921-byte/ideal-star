<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理想之星 - 理想保險年度表揚</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 50%, #FFAA00 100%);
            min-height: 100vh; 
            overflow-x: hidden;
        }
        .main-title { 
            color: #fff; 
            text-shadow: 4px 4px 8px rgba(0,0,0,0.4); 
            font-size: 5rem; 
            font-weight: 900; 
            margin: 40px 0; 
            letter-spacing: 8px;
        }
        .subtitle {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        /* 橫向滑動容器 */
        .slider-container {
            overflow: hidden;
            width: 100%;
            margin: 40px 0;
            padding: 20px 0;
        }
        .slider-track {
            display: flex;
            animation: scroll 30s linear infinite;
            width: max-content;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .slider-track:hover { animation-play-state: paused; }
        
        /* 績優卡片 */
        .star-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 0;
            margin: 0 15px;
            width: 350px;
            flex-shrink: 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .star-card:hover {
            transform: translateY(-10px);
        }
        .star-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }
        .star-info {
            padding: 20px;
            text-align: center;
        }
        .star-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #FF6B35;
            margin-bottom: 10px;
        }
        .star-award {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 5px;
        }
        .star-position {
            font-size: 1rem;
            color: #888;
        }
        
        /* 業績跑馬燈 */
        .marquee-box { 
            background: #000; 
            border: 4px solid #FF6B35; 
            color: #FFD700; 
            font-size: 1.8rem; 
            font-weight: bold; 
            padding: 15px 0; 
            border-radius: 50px; 
            margin: 30px 0; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        
        .admin-btn { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            z-index: 1000;
            background: #FF6B35;
            border: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .admin-btn:hover {
            background: #F7931E;
        }
    </style>
</head>
<body>
<div class="container-fluid py-5">
    <h1 class="text-center main-title">🌟 理想之星 🌟</h1>
    <p class="text-center subtitle">突破每一道界線 投出無限可能</p>
    
    <div class="marquee-box">
        <marquee scrollamount="10">
            {% for p in performance %}
            🏆 {{ p[1] }} {{ p[2] }} 完成進度: {{ p[4] }}% | 
            {% endfor %}
        </marquee>
    </div>

    <div class="slider-container">
        <div class="slider-track">
            {% for star in stars + stars %}
            <div class="star-card">
                <img src="{{ star[4] or 'https://via.placeholder.com/350x400/FF6B35/FFFFFF?text=理想之星' }}" 
                     class="star-img" alt="{{ star[1] }}">
                <div class="star-info">
                    <div class="star-name">{{ star[1] }}</div>
                    <div class="star-award">🏆 {{ star[3] }}</div>
                    <div class="star-position">{{ star[2] }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="text-center mt-5">
        <h3 style="color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
            🔥 女籃精神 突破界線 投出無限可能 🔥
        </h3>
    </div>
</div>

<a href="/admin" class="btn btn-lg shadow admin-btn">⚙️ 後台管理</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
