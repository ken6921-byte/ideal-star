<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理想之星 - 理想保險年度表揚</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans TC', sans-serif; margin: 0; padding: 0; }
        body { 
            background: #ff9a9e;
            min-height: 100vh; 
            overflow-x: hidden;
            position: relative;
        }
        
        /* 背景色塊層 */
        .bg-layer-1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, #ffc3a0 0%, #ffafbd 100%);
            clip-path: polygon(0 0, 100% 0, 100% 70%, 95% 75%, 90% 68%, 85% 80%, 80% 65%, 75% 78%, 70% 70%, 65% 82%, 60% 68%, 55% 80%, 50% 65%, 45% 78%, 40% 70%, 35% 75%, 30% 68%, 25% 80%, 20% 72%, 15% 78%, 10% 70%, 5% 75%, 0 68%);
            z-index: 0;
        }
        
        .bg-layer-2 {
            position: absolute;
            top: 35%;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(248,248,248,0.5) 100%);
            clip-path: polygon(0 25%, 5% 30%, 10% 20%, 15% 35%, 20% 22%, 25% 32%, 30% 18%, 35% 28%, 40% 20%, 45% 30%, 50% 15%, 55% 28%, 60% 20%, 65% 32%, 70% 18%, 75% 28%, 80% 22%, 85% 30%, 90% 20%, 95% 28%, 100% 25%, 100% 85%, 95% 80%, 90% 88%, 85% 78%, 80% 85%, 75% 80%, 70% 88%, 65% 82%, 60% 85%, 55% 78%, 50% 88%, 45% 80%, 40% 85%, 35% 82%, 30% 88%, 25% 78%, 20% 85%, 15% 80%, 10% 88%, 5% 82%, 0 85%);
            z-index: 0;
        }
        
        .bg-layer-3 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(0deg, #3d3d4e 0%, #555566 100%);
            clip-path: polygon(0 35%, 5% 28%, 10% 38%, 15% 25%, 20% 35%, 25% 22%, 30% 32%, 35% 25%, 40% 35%, 45% 20%, 50% 30%, 55% 25%, 60% 35%, 65% 22%, 70% 32%, 75% 25%, 80% 35%, 85% 20%, 90% 30%, 95% 25%, 100% 35%, 100% 100%, 0 100%);
            z-index: 0;
        }
        
        .content-wrapper {
            position: relative;
            z-index: 2;
        }
        
        .main-title { 
            color: #fff; 
            text-shadow: 5px 5px 15px rgba(0,0,0,0.6); 
            font-size: 6rem; 
            font-weight: 900; 
            margin: 60px 0 20px 0; 
            letter-spacing: 15px;
        }
        .subtitle {
            color: rgba(255,255,255,0.95);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 40px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.4);
            letter-spacing: 3px;
        }
        
        /* 橫向滑動容器 */
        .slider-container {
            overflow: hidden;
            width: 100%;
            margin: 50px 0;
            padding: 30px 0;
        }
        .slider-track {
            display: flex;
            gap: 40px;
            animation: scroll 50s linear infinite;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-390px * 10)); }
        }
        .slider-track:hover { animation-play-state: paused; }
        
        /* 績優卡片 */
        .star-card {
            background: #fff;
            border: 15px solid #fff;
            border-radius: 10px;
            width: 350px;
            flex-shrink: 0;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
            transform: rotate(-3deg);
        }
        .star-card:nth-child(even) {
            transform: rotate(3deg);
        }
        .star-card:hover {
            transform: rotate(0deg) translateY(-15px) scale(1.08);
            box-shadow: 0 35px 80px rgba(0,0,0,0.6);
        }
        .star-img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 5px;
        }
        .star-info {
            padding: 20px;
            text-align: center;
        }
        .star-award {
            font-size: 1.4rem;
            font-weight: 900;
            color: #d32f2f;
            margin-bottom: 10px;
        }
        .star-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
        }
        .star-position {
            font-size: 1rem;
            color: #666;
        }
        
        .marquee-box { 
            background: linear-gradient(90deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            border: 5px solid #d32f2f;
            color: #FFD700; 
            font-size: 2rem; 
            font-weight: 900; 
            padding: 20px 0; 
            border-radius: 60px; 
            margin: 40px auto; 
            max-width: 95%;
            box-shadow: 0 10px 40px rgba(211,47,47,0.4);
        }
        
        .admin-btn { 
            position: fixed; 
            bottom: 40px; 
            right: 40px; 
            z-index: 1000;
            background: #d32f2f;
            border: none;
            font-size: 1.2rem;
            padding: 15px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 50px;
            font-weight: bold;
            color: #fff;
        }
        .admin-btn:hover {
            transform: translateY(-5px);
            background: #f44336;
        }
    </style>
</head>
<body>
<div class="bg-layer-1"></div>
<div class="bg-layer-2"></div>
<div class="bg-layer-3"></div>

<div class="content-wrapper">
    <div class="container-fluid py-5">
        <h1 class="text-center main-title">理想之星</h1>
        <p class="text-center subtitle">突破每一道界線 • 投出無限可能</p>
        
        <div class="marquee-box">
            <marquee scrollamount="12">
                {% for p in performance %}
                🏆 {{ p[1] }} {{ p[2] }} 完成進度: {{ p[4] }}% 
                {% if not loop.last %} | {% endif %}
                {% endfor %}
            </marquee>
        </div>

        <div class="slider-container">
            <div class="slider-track">
                {% for star in (stars + stars) %}
                <div class="star-card">
                    <img src="{{ star[4] or 'https://via.placeholder.com/350x420/ff9a9e/FFFFFF?text=' + star[1] }}" 
                         class="star-img" alt="{{ star[1] }}">
                    <div class="star-info">
                        <div class="star-award">🏆 {{ star[3] }}</div>
                        <div class="star-name">{{ star[1] }}</div>
                        <div class="star-position">{{ star[2] }}</div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<a href="/admin" class="btn btn-lg shadow admin-btn">⚙️ 管理</a>
</body>
</html>
