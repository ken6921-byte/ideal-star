<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>後台管理 - 理想之星</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>⚙️ 後台管理</h1>
        <a href="/" class="btn btn-primary">← 返回首頁</a>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-warning"><h5>新增績優人員</h5></div>
        <div class="card-body">
            <form action="/add_star" method="POST">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <input type="text" name="name" class="form-control" placeholder="姓名" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <input type="text" name="position" class="form-control" placeholder="職稱" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <input type="text" name="award" class="form-control" placeholder="獎項" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <input type="text" name="photo_url" class="form-control" placeholder="照片網址">
                    </div>
                </div>
                <button type="submit" class="btn btn-success">新增</button>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-info text-white"><h5>新增業績紀錄</h5></div>
        <div class="card-body">
            <form action="/add_performance" method="POST">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <input type="text" name="name" class="form-control" placeholder="姓名" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <input type="number" step="0.01" name="target" class="form-control" placeholder="目標金額" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <input type="number" step="0.01" name="current" class="form-control" placeholder="已達成金額" required>
                    </div>
                    <div class="col-md-2 mb-3">
                        <button type="submit" class="btn btn-primary w-100">新增</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-dark text-white"><h5>管理績優人員</h5></div>
        <div class="card-body">
            <table class="table table-bordered">
                <thead><tr><th>姓名</th><th>職稱</th><th>獎項</th><th>操作</th></tr></thead>
                <tbody>
                    {% for star in stars %}
                    <tr>
                        <td>{{ star[1] }}</td>
                        <td>{{ star[2] }}</td>
                        <td>{{ star[3] }}</td>
                        <td>
                            <form action="/delete_star/{{ star[0] }}" method="POST" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('確定刪除？')">刪除</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-secondary text-white"><h5>管理業績紀錄</h5></div>
        <div class="card-body">
            <table class="table table-bordered">
                <thead><tr><th>姓名</th><th>職稱</th><th>目標</th><th>達成</th><th>完成率</th><th>操作</th></tr></thead>
                <tbody>
                    {% for p in performance %}
                    <tr>
                        <td>{{ p[1] }}</td>
                        <td>{{ p[2] }}</td>
                        <td>{{ p[2] }}</td>
                        <td>{{ p[3] }}</td>
                        <td><strong>{{ p[4] }}%</strong></td>
                        <td>
                            <form action="/delete_performance/{{ p[0] }}" method="POST" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('確定刪除？')">刪除</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
